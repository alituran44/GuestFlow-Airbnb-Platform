# ==============================================================================
# HostifyOS Production Nginx Server Configuration (Sentinel Pentest Hardened)
# Domain: hostifyos.com / www.hostifyos.com
# Standards: WCAG 2.1 AA | SSL Labs A+ | HSTS Preload | Zero-Dotfile Exposure
# ==============================================================================

# Rate Limiting Zone for DDOS & Brute-Force Mitigation
limit_req_zone $binary_remote_addr zone=hostify_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=hostify_conn:10m;

# HTTP (Port 80) -> Automatic HTTPS (Port 443) 301 Redirect
server {
    listen 80;
    listen [::]:80;
    server_name hostifyos.com www.hostifyos.com;
    
    # ACME Challenge for Let's Encrypt SSL Certificates
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://www.hostifyos.com$request_uri;
    }
}

# Non-WWW HTTPS -> Canonical WWW HTTPS 301 Redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hostifyos.com;

    ssl_certificate /etc/letsencrypt/live/hostifyos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hostifyos.com/privkey.pem;

    return 301 https://www.hostifyos.com$request_uri;
}

# Main HTTPS Production Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hostifyos.com;

    root /var/www/hostifyos;
    index index.html;

    # --------------------------------------------------------------------------
    # SSL / TLS Hardening (Qualys SSL Labs A+ Grade)
    # --------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/hostifyos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hostifyos.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Sentinel Security Headers & Content Security Policy (CSP)
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://fonts.googleapis.com https://js.stripe.com https://*.dodopayments.com https://checkout.dodopayments.com https://*.nkolayislem.com.tr https://*.paynkolay.com.tr https://accounts.google.com https://appleid.cdn-apple.com https://widget.trustpilot.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://unpkg.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.open-meteo.com https://api.aladhan.com https://*.stripe.com https://*.dodopayments.com https://live.dodopayments.com https://test.dodopayments.com https://*.nkolayislem.com.tr https://*.paynkolay.com.tr https://widget.trustpilot.com; frame-src 'self' https://js.stripe.com https://*.dodopayments.com https://checkout.dodopayments.com https://*.nkolayislem.com.tr https://*.paynkolay.com.tr https://accounts.google.com https://appleid.cdn-apple.com https://widget.trustpilot.com https://www.google.com; frame-ancestors 'self';" always;

    # --------------------------------------------------------------------------
    # Compression (Gzip & Brotli)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml application/xml+rss image/svg+xml;

    # --------------------------------------------------------------------------
    # Security: Deny Hidden Files / Dotfiles (.env, .git, .htaccess, etc.)
    # --------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny direct access to backup files and scripts
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|key|pem)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # Performance: Static Assets Caching & Immutable Resources
    # --------------------------------------------------------------------------
    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # AI Grounding, Robots & Sitemaps
    # --------------------------------------------------------------------------
    location = /robots.txt {
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Access-Control-Allow-Origin "*";
        expires 1d;
    }

    location = /llms.txt {
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Access-Control-Allow-Origin "*";
        expires 1d;
    }

    location = /llms-full.txt {
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Access-Control-Allow-Origin "*";
        expires 1d;
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Content-Type "application/xml; charset=utf-8";
        add_header Access-Control-Allow-Origin "*";
        expires 1d;
    }

    # --------------------------------------------------------------------------
    # Clean URLs & SPA Routing
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=hostify_limit burst=20 nodelay;
        limit_conn hostify_conn 20;
        try_files $uri $uri.html $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # Custom Error Pages
    # --------------------------------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
